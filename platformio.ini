; Cardputer MIDI Controller / Sequencer
; One firmware for both M5Stack Cardputer and Cardputer ADV — the board is
; detected at boot (M5Unified), so there is a single build target.

[env:cardputer]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board     = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

build_flags =
    -DARDUINO_USB_MODE=0        ; TinyUSB device stack (needed for USB MIDI)
    -DARDUINO_USB_CDC_ON_BOOT=1 ; keep Serial on USB alongside MIDI
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    m5stack/M5Cardputer@^1.1.1
    h2zero/NimBLE-Arduino@^2.3.0

; ── diagnostic builds (to find what stops a board from booting) ───────────────
; pio run -e cardputer-noaudio    everything except the speaker synth
; pio run -e cardputer-minimal    also without the filesystem, WiFi sync and generated mode
[env:cardputer-noaudio]
extends = env:cardputer
build_flags =
    ${env:cardputer.build_flags}
    -DCMC_NO_AUDIO

[env:cardputer-minimal]
extends = env:cardputer
build_flags =
    ${env:cardputer.build_flags}
    -DCMC_NO_AUDIO
    -DCMC_MINIMAL
