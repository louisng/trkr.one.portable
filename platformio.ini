; Cardputer MIDI Controller / Sequencer
; One firmware for both M5Stack Cardputer and Cardputer ADV — the board is
; detected at boot (M5Unified), so there is a single build target.

[env:cardputer]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board     = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv

build_unflags =
    -DARDUINO_USB_MODE=1        ; board default (hardware CDC); we use TinyUSB instead

build_flags =
    -DARDUINO_USB_MODE=0        ; TinyUSB device stack (needed for USB MIDI)
    -DARDUINO_USB_CDC_ON_BOOT=1 ; keep Serial on USB alongside MIDI
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    m5stack/M5Cardputer@^1.1.1
